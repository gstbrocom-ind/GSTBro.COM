services:
  - type: web
    name: gstbro-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w @gst/server
    startCommand: npm run start -w @gst/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: SITE_URL
        value: https://gstbro.in
      - key: CORS_ORIGINS
        value: https://gstbro.in,https://www.gstbro.in,https://admin.gstbro.in
