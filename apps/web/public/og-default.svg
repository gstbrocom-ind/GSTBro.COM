<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B18"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glow effect -->
  <circle cx="1000" cy="150" r="300" fill="#2563EB" opacity="0.15" filter="blur(60px)"/>
  <circle cx="200" cy="500" r="250" fill="#06B6D4" opacity="0.1" filter="blur(60px)"/>

  <!-- Logo and Badge -->
  <g transform="translate(100, 100)">
    <!-- Logo Icon -->
    <rect width="72" height="72" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <path d="M36 16 L54 25 V42 C54 52 46 59 36 62 C26 59 18 52 18 42 V25 Z" fill="url(#accentGrad)"/>
    <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">₹</text>

    <!-- Brand Name -->
    <text x="92" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">GST<tspan fill="url(#accentGrad)">Bro</tspan></text>
  </g>

  <!-- Tagline Pill -->
  <g transform="translate(100, 220)">
    <rect width="390" height="38" rx="19" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#10B981"/>
    <text x="36" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#93C5FD" letter-spacing="0.5">ICAI CHARTERED ACCOUNTANT SUPERVISED</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" line-height="1.2">
    GST Registration, Filing &amp;
  </text>
  <text x="100" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#accentGrad)">
    Notice Defense Across India
  </text>

  <!-- Description -->
  <text x="100" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    Automate monthly GSTR-1 &amp; 3B filings, lock down 100% eligible 2B ITC,
  </text>
  <text x="100" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    and secure senior CA defense with zero late fee guarantee.
  </text>

  <!-- Bottom Badges -->
  <g transform="translate(100, 540)">
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#38BDF8">✓ 99.9% On-Time SLA</text>
    <text x="240" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#38BDF8">✓ 2B ITC Recovery</text>
    <text x="470" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#38BDF8">✓ 3-5 Day Registration</text>
    <text x="750" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">gstbro.in</text>
  </g>
</svg>
