<!DOCTYPE html>
<html lang="en-IN" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('gstbro_theme');
          var theme = (saved === 'dark') ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.setAttribute('data-theme', theme);
        } catch(e) {}

        try {
          var cached = localStorage.getItem('gstbro_public_settings_cache');
          if (cached) {
            var parsed = JSON.parse(cached);
            if (parsed && parsed.faviconUrl) {
              var fav = document.getElementById('dynamic-favicon');
              if (fav) {
                fav.href = parsed.faviconUrl;
                if (!parsed.faviconUrl.endsWith('.svg')) {
                  fav.removeAttribute('type');
                }
              }
              var appleFav = document.getElementById('dynamic-apple-touch-icon');
              if (appleFav) {
                appleFav.href = parsed.faviconUrl;
              }
            }
          }
        } catch(e) {}
      })();
    </script>
    <title>GSTBro — Chartered Accountant GST Services, Registration &amp; Returns India</title>
    <meta
      name="description"
      content="End-to-end GST services platform across India. ICAI Chartered Accountant-supervised monthly GSTR-1 &amp; 3B return filing, fast online GST registration, 2B ITC reconciliation &amp; notice defense."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://gstbro.com/" />

    <!-- Cloudflare Turnstile API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

    <!-- Favicon & PWA Icons -->
    <link rel="icon" id="dynamic-favicon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" id="dynamic-apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GSTBro" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563EB" />

    <!-- Open Graph / Social Sharing Defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GSTBro" />
    <meta property="og:title" content="GSTBro — Chartered Accountant GST Services &amp; Compliance India" />
    <meta
      property="og:description"
      content="ICAI Chartered Accountant-supervised monthly GSTR-1 &amp; 3B filing, turnkey GST registration, 2B ITC recovery, and scrutiny defense for businesses across India."
    />
    <meta property="og:url" content="https://gstbro.com/" />
    <meta property="og:image" content="https://gstbro.com/og-default.svg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GSTBro — Chartered Accountant GST Services &amp; Compliance India" />
    <meta
      name="twitter:description"
      content="ICAI Chartered Accountant-supervised monthly GSTR-1 &amp; 3B filing, turnkey GST registration, 2B ITC recovery, and scrutiny defense for businesses across India."
    />
    <meta name="twitter:image" content="https://gstbro.com/og-default.svg" />

    <!-- Google Search Console Verification Meta Tag (Fallback option when DNS TXT is pending) -->
    <!-- Replace content with production verification token when provided in Google Search Console -->
    <meta name="google-site-verification" content="gstbro-gsc-verification-pending" />

    <!-- Font Preconnect & Optimized Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
